name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test              # only build if tests passed
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ercot-api .
