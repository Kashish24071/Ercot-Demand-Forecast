name: Data and model pipeline

on:
  schedule:
    - cron: "23 12 * * *"   # 7:23 am Dallas (CDT)
    - cron: "47 22 * * *"   # backup run, 5:47 pm Dallas
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # lets the job push commits

concurrency: pipeline        # never run two copies at once

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ingest
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python src/ingest.py

      - name: Validate
        run: python src/validate.py

      - name: Train and evaluate
        run: python src/train.py

      - name: Test
        run: pytest -v

      - name: Commit new data and model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models
          git diff --cached --quiet || git commit -m "Daily data and model update"
          git push
